<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="description" content="Healthwise lite demo: your Function Health results charted over time and read by the experts you choose."><link rel="icon" href="/favicon.ico"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Healthwise for Function</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Layout: Healthwise shell. Fixed icon rail on the left (top bar on phones), one scrolling main column of modules.
   Tokens follow the Healthwise light palette and its desaturated status colors (terracotta / ochre / sage). */
:root {
  --bg: #faf9f5;
  --surface: #fdfdfb;
  --surface-2: #f4f3ed;
  --inner: #ffffff;
  --line: rgba(20,20,19,0.08);
  --line-strong: rgba(20,20,19,0.15);
  --text: #141413;
  --muted: rgba(20,20,19,0.60);
  --dim: rgba(20,20,19,0.42);
  --accent: #c96a4a;
  --accent-ink: #ffffff;
  --accent-soft: rgba(201,106,74,0.12);
  --high: #A65A3C; --high-mark: #C27A5A; --high-soft: rgba(194,122,90,0.08); --high-line: rgba(194,122,90,0.26);
  --low: #8F6B26;  --low-mark: #C9A04A;  --low-soft: rgba(201,160,74,0.09);  --low-line: rgba(201,160,74,0.30);
  --ok: #4E7A56;   --ok-mark: #7DA382;   --ok-soft: #F2F6EE;                 --ok-line: rgba(125,163,130,0.26);
  --ok-band: rgba(125,163,130,0.16);
  --neutral-mark: rgba(20,20,19,0.34);
  --reading: rgba(20,20,19,0.40);
  --grid: rgba(20,20,19,0.07);
  --shadow: 0 1px 3px rgba(20,20,19,0.05), 0 1px 2px rgba(20,20,19,0.04);
  --scrim: rgba(20,20,19,0.32);
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-serif: 'Newsreader', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --r-card: 14px;
  --r-sm: 8px;
  --rail: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1010; --surface: #151717; --surface-2: #1a1d1c; --inner: #1c1f1e;
    --line: rgba(255,255,255,0.07); --line-strong: rgba(255,255,255,0.14);
    --text: #f2f3f1; --muted: rgba(226,231,229,0.62); --dim: rgba(226,231,229,0.42);
    --accent: #e08b6d; --accent-ink: #1b100c; --accent-soft: rgba(224,139,109,0.16);
    --high: #E2A890; --high-mark: #C98A70; --high-soft: rgba(201,138,112,0.10); --high-line: rgba(201,138,112,0.30);
    --low: #DABE7E;  --low-mark: #C2A25C;  --low-soft: rgba(194,162,92,0.10);  --low-line: rgba(194,162,92,0.30);
    --ok: #A1C6A5;   --ok-mark: #7FA584;   --ok-soft: rgba(127,165,132,0.08);  --ok-line: rgba(127,165,132,0.26);
    --ok-band: rgba(127,165,132,0.14);
    --neutral-mark: rgba(255,255,255,0.36); --reading: rgba(236,240,238,0.42); --grid: rgba(255,255,255,0.06);
    --shadow: none; --scrim: rgba(0,0,0,0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1010; --surface: #151717; --surface-2: #1a1d1c; --inner: #1c1f1e;
  --line: rgba(255,255,255,0.07); --line-strong: rgba(255,255,255,0.14);
  --text: #f2f3f1; --muted: rgba(226,231,229,0.62); --dim: rgba(226,231,229,0.42);
  --accent: #e08b6d; --accent-ink: #1b100c; --accent-soft: rgba(224,139,109,0.16);
  --high: #E2A890; --high-mark: #C98A70; --high-soft: rgba(201,138,112,0.10); --high-line: rgba(201,138,112,0.30);
  --low: #DABE7E;  --low-mark: #C2A25C;  --low-soft: rgba(194,162,92,0.10);  --low-line: rgba(194,162,92,0.30);
  --ok: #A1C6A5;   --ok-mark: #7FA584;   --ok-soft: rgba(127,165,132,0.08);  --ok-line: rgba(127,165,132,0.26);
  --ok-band: rgba(127,165,132,0.14);
  --neutral-mark: rgba(255,255,255,0.36); --reading: rgba(236,240,238,0.42); --grid: rgba(255,255,255,0.06);
  --shadow: none; --scrim: rgba(0,0,0,0.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { font-family: var(--font-ui); color: var(--text); font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }

/* ── Rail ── */
.rail {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 20;
  width: calc(var(--rail) + env(safe-area-inset-left, 0px));
  padding: calc(14px + env(safe-area-inset-top, 0px)) 0 calc(14px + env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left, 0px);
  border-right: 1px solid var(--line); background: var(--bg);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.rail .mark { width: 34px; height: 34px; margin-bottom: 14px; color: var(--text); }
.nav-btn {
  width: 48px; padding: 8px 0 6px; border: 0; border-radius: 10px; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--dim);
  font-size: 9.5px; font-weight: 500; position: relative; transition: background .15s, color .15s;
}
.nav-btn svg { width: 19px; height: 19px; }
.nav-btn:hover { background: var(--line); color: var(--muted); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav-btn .lock-dot { position: absolute; top: 5px; right: 8px; width: 11px; height: 11px; color: var(--dim); }
.rail .spacer { flex: 1; }

/* ── Main ── */
main {
  margin-left: calc(var(--rail) + env(safe-area-inset-left, 0px));
  padding-block: 28px 64px;
  padding-left: max(16px, 28px);
  padding-right: max(16px, env(safe-area-inset-right, 0px), 28px);
  max-width: 1400px;
}
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin: 4px 0 22px; }
.page-head h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; text-wrap: balance; }
.page-head .sub { color: var(--muted); font-size: 13px; margin: 0; max-width: 70ch; }
.edition { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
.edition b { color: var(--accent); font-weight: 600; }

.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-strong); background: var(--inner); border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text); text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--dim); }
.btn svg { width: 14px; height: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: none; }

.module { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.mod-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.count-pill { font-size: 10px; font-weight: 600; letter-spacing: 0; background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 1px 7px; }
.link-btn { border: 0; background: none; color: var(--accent); font-size: 12px; font-weight: 500; cursor: pointer; padding: 0; }
.grid { display: grid; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }

/* ── Gate (connect / loading / errors) ── */
.gate { max-width: 620px; margin: 6vh auto 0; text-align: left; }
.gate .module { padding: 28px; }
.gate h2 { font-family: var(--font-serif); font-weight: 400; font-size: 30px; line-height: 1.15; margin: 0 0 10px; text-wrap: balance; }
.gate p { color: var(--muted); font-size: 14px; margin: 0 0 14px; max-width: 60ch; }
.gate .steps { display: grid; gap: 10px; margin: 18px 0 22px; padding: 0; list-style: none; }
.gate .steps li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 13px; }
.gate .steps .n { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; font-size: 11px; font-weight: 600; }
.gate .privacy { display: flex; gap: 10px; align-items: flex-start; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 20px; color: var(--muted); font-size: 12px; }
.gate .privacy svg { flex: none; width: 16px; height: 16px; margin-top: 1px; color: var(--ok); }
.gate .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.note { font-size: 12px; color: var(--muted); }
.note.warn { color: var(--high); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

/* ── Dashboard ── */
.dash-top { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); }
.summary-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.big small { font-size: 15px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.stackbar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; margin: 16px 0 10px; background: var(--surface-2); gap: 2px; }
.stackbar span { display: block; height: 100%; }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend-row i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 12.5px; margin-top: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; text-align: right; }

.tiles { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.tile { background: var(--inner); border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px 11px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; transition: border-color .15s; }
.tile:hover { border-color: var(--line-strong); }
.tile.high { background: var(--high-soft); border-color: var(--high-line); }
.tile.low { background: var(--low-soft); border-color: var(--low-line); }
.tile.ok { background: var(--ok-soft); border-color: var(--ok-line); }
.tile .t-top { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; font-weight: 500; }
.tile .t-top .nm { min-width: 0; overflow-wrap: anywhere; }
.tile .t-top .delta { flex: none; font-size: 10.5px; font-weight: 600; }
.tile .val { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
.tile .val .u { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 3px; }
.tile .foot { font-size: 11px; color: var(--muted); margin-top: 4px; }
.c-high { color: var(--high); } .c-low { color: var(--low); } .c-ok { color: var(--ok); } .c-muted { color: var(--muted); }

.rangebar { position: relative; height: 18px; margin: 6px 0 2px; }
.rangebar svg { display: block; width: 100%; height: 18px; overflow: visible; }

.movers { display: grid; gap: 0; }
.mover { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.mover:first-child { border-top: 0; }
.mover .nm { font-weight: 500; font-size: 13px; }
.mover .sub { font-size: 11.5px; color: var(--muted); }
.mover .v { text-align: right; font-weight: 600; font-size: 13px; }
.mover .v small { display: block; font-weight: 500; font-size: 11px; }

.dash-mid { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: start; }

.avatars { display: flex; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 2px solid var(--surface); }
.avatars .av + .av { margin-left: -8px; }

.unlock { background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: var(--r-card); padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: center; }
.unlock h3 { font-family: var(--font-serif); font-weight: 400; font-size: 21px; margin: 0 0 4px; }
.unlock p { margin: 0; color: var(--muted); max-width: 64ch; }
.unlock ul { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.unlock li { font-size: 11.5px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 9px; color: var(--muted); background: var(--inner); }

/* ── Labs ── */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.search { flex: 1 1 220px; max-width: 320px; border: 1px solid var(--line-strong); background: var(--inner); border-radius: 999px; padding: 7px 14px; font: inherit; color: var(--text); }
.chip { border: 1px solid var(--line-strong); background: var(--inner); border-radius: 999px; padding: 5px 11px; font-size: 12px; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cat { padding: 0; overflow: hidden; }
.cat .mod-head { padding: 16px 20px 0; margin-bottom: 8px; }
.flag-pill { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--high); border: 1px solid var(--high-line); background: var(--high-soft); border-radius: 999px; padding: 2px 8px; }
.table-wrap { overflow-x: auto; }
table.labs { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 12.5px; }
table.labs th { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); text-align: right; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
table.labs th:first-child, table.labs td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.labs th.latest, table.labs td.latest { background: var(--surface-2); }
table.labs td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.labs tr:last-child td { border-bottom: 0; }
table.labs tbody tr { cursor: pointer; }
table.labs tbody tr:hover td { background: var(--surface-2); }
table.labs td.mk { font-weight: 500; white-space: normal; min-width: 180px; max-width: 260px; }
table.labs td.mk .u { display: block; font-weight: 400; color: var(--dim); font-size: 11px; }
table.labs td.v-high { color: var(--high); font-weight: 600; }
table.labs td.v-low { color: var(--low); font-weight: 600; }
table.labs td.v-empty { color: var(--dim); }
table.labs td.rng { color: var(--muted); font-size: 11.5px; }
table.labs td.spark { width: 110px; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

/* ── Chart dialog ── */
dialog { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); color: var(--text); padding: 0; width: min(1140px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 20px 60px rgba(0,0,0,.18); }
dialog::backdrop { background: var(--scrim); }
#unlock-dlg { width: min(740px, calc(100vw - 32px)); }
.dlg-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 20px 22px 6px; }
.dlg-head h2 { margin: 0 0 2px; font-size: 18px; font-weight: 600; text-wrap: balance; }
.dlg-head .meta { color: var(--muted); font-size: 12px; }
.x-btn { border: 0; background: var(--surface-2); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; flex: none; }
.x-btn svg { width: 14px; height: 14px; }
.dlg-body { padding: 8px 22px 22px; }
.dlg-stats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 6px 0 12px; }
.dlg-stats div { font-size: 11px; color: var(--muted); }
.dlg-stats b { display: block; font-size: 17px; color: var(--text); font-weight: 600; }
.chart-box { width: 100%; }
.chart-box svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.desc { color: var(--muted); font-size: 12.5px; margin: 12px 0 0; max-width: 70ch; }
.qual-list { display: grid; gap: 6px; margin-top: 8px; }
.qual-list div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 6px 0; }

/* ── Advisor ── */
.adv-layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
.experts { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) { .experts { grid-template-columns: minmax(0, 1fr); } }
.expert { text-align: left; border: 1px solid var(--line); background: var(--inner); border-radius: 12px; padding: 13px; cursor: pointer; display: grid; grid-template-columns: 34px 1fr 18px; gap: 10px; align-items: start; transition: border-color .15s, background .15s; }
.expert:hover { border-color: var(--line-strong); }
.expert .av { width: 34px; height: 34px; border: 0; }
.expert .nm { font-weight: 600; font-size: 13px; }
.expert .lens { font-size: 11px; color: var(--accent); font-weight: 500; }
.expert .bl { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
.expert .ck { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; }
.expert .ck svg { width: 11px; height: 11px; opacity: 0; color: var(--accent-ink); }
.expert[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.expert[aria-pressed="true"] .av { background: var(--accent); color: var(--accent-ink); }
.expert[aria-pressed="true"] .ck { background: var(--accent); border-color: var(--accent); }
.expert[aria-pressed="true"] .ck svg { opacity: 1; }
.adv-bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 16px; }
select.focus { border: 1px solid var(--line-strong); background: var(--inner); color: var(--text); border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 12px; }
.finding { background: var(--inner); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.finding .who { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.finding .who b { color: var(--text); font-weight: 600; }
.finding .who .conf { margin-left: auto; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--dim); }
.finding h3 { font-family: var(--font-serif); font-weight: 400; font-size: 19px; line-height: 1.35; margin: 12px 0 10px; text-wrap: pretty; }
.marker-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.mchip { border: 1px solid var(--line-strong); border-radius: 6px; padding: 2px 8px; font-size: 11.5px; background: var(--surface); cursor: pointer; }
.mchip b { font-weight: 600; }
.finding dl { display: grid; grid-template-columns: 74px 1fr; gap: 6px 12px; margin: 0; font-size: 12.5px; }
.finding dt { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--dim); padding-top: 2px; }
.finding dd { margin: 0; }
.finding .pts { margin: 0; padding-left: 16px; }
.finding .pts li + li { margin-top: 3px; }
.consensus { font-family: var(--font-serif); font-size: 17px; line-height: 1.4; padding: 16px 20px; border-radius: 12px; background: var(--surface-2); }
.consensus .eyebrow { margin-bottom: 6px; font-family: var(--font-ui); }
.disclaimer { font-size: 11.5px; color: var(--dim); line-height: 1.5; }
.locked-list { list-style: none; margin: 10px 0 14px; padding: 0; display: grid; gap: 8px; }

edium"},{"id":"huberman","headline":"Hormones, thyroid and vitamin D are all in the band Huberman's framework looks for; sleep and light protocols have nothing to fix here.","focus":[{"marker":"Testosterone, Total","note":"640 ng/dL sits in the upper-middle of range, with free testosterone 66 pg/mL to match."},{"marker":"Cortisol","note":"Morning cortisol 11.9 ug/dL is mid-range, consistent with an intact stress rhythm."},{"marker":"Vitamin D","note":"47 ng/mL is inside the 40 to 60 window this framework targets, up from 34 in Oct 2024."},{"marker":"Thyroid-Stimulating Hormone (TSH)","note":"2.4 mIU/L with normal free T3 and T4."}],"takeaway":"Nothing on the nervous-system side of this panel needs attention. The framework would point at the lipid numbers as a cardio training and nutrition question rather than a hormonal one.","ask_your_doctor":"Is my morning cortisol worth repeating with an evening value to see the full daily curve?","confidence":"medium"},{"id":"hyman","headline":"Homocysteine 11.2 and ferritin 34 are the two upstream signals this framework would chase; thyroid and insulin are clean.","focus":[{"marker":"Homocysteine","note":"11.2 umol/L is inside Function's range but above the under-8 band in Hyman's framework; B12 462 and folate 12.4 are adequate, so methylation is the question."},{"marker":"Ferritin","note":"34 ng/mL is below range and has drifted down from 52 in Oct 2024 with normal iron saturation, which this framework reads as a slow drain rather than a diet gap."},{"marker":"Insulin","note":"4.2 uIU/mL meets the under-5 target."},{"marker":"Gamma-glutamyl Transferase (GGT)","note":"16 U/L is under the 25 this framework wants; liver and oxidative stress look quiet."}],"takeaway":"Root causes to look at are methylation and iron loss, not glucose or liver. The lipid picture stands on its own.","ask_your_doctor":"Should we look for a source of iron loss given ferritin keeps falling with normal saturation, and would an MTHFR test explain the homocysteine?","confidence":"high"},{"id":"bredesen","headline":"Homocysteine 11.2 and an omega-3 index of 5.4% are the two markers this framework would move first for long-term brain protection.","focus":[{"marker":"Homocysteine","note":"Bredesen's framework targets under 7 umol/L; 11.2 is well above it and has been above 11 on every draw."},{"marker":"Omega-3 Total / OmegaCheck","note":"5.4% is below Function's 5.5 floor and far from the 10% this framework wants; it has climbed from 4.6 in Oct 2024."},{"marker":"Apolipoprotein B (ApoB)","note":"108 mg/dL matters here as the vascular contributor to cognitive risk."},{"marker":"Mercury","note":"5 mcg/L is within range; the toxic subtype is not in play."}],"takeaway":"Two modifiable brain-risk markers, both already moving slowly in the right direction. The vascular contributor is the lipid problem the other experts flag.","ask_your_doctor":"Would you support targeting homocysteine under 7 and omega-3 index over 8, and is APOE genotype worth knowing?","confidence":"medium"},{"id":"longo","headline":"Triglycerides 71 and glucose 87 are where Longo's framework wants them; this panel shows no reason to change the eating window.","focus":[{"marker":"Triglycerides","note":"71 mg/dL sits close to the under-70 target and has fallen from 88 in Oct 2024."},{"marker":"Glucose","note":"87 mg/dL fasting, stable across five draws."},{"marker":"Insulin","note":"4.2 uIU/mL is low, consistent with metabolic flexibility."},{"marker":"Biological Age","note":"44.3 years and falling since Oct 2024."}],"takeaway":"Metabolic markers already look like the output of periodic fasting and a mostly plant-based pattern. The framework has little to add beyond holding course.","ask_your_doctor":"Is IGF-1 worth adding to the next panel so we can see growth signaling alongside these numbers?","confidence":"medium"},{"id":"patrick","headline":"Omega-3 index 5.4%, ferritin 34 and RBC magnesium 5.3 are the three nutrient gaps this framework would close first.","focus":[{"marker":"Omega-3 Total / OmegaCheck","note":"5.4% is below the 8 to 10% Patrick's framework targets; EPA 0.8 and DHA 3.8 show DHA carrying most of it."},{"marker":"Ferritin","note":"34 ng/mL and falling; this framework treats iron stores as a performance and cognition input."},{"marker":"Magnesium, RBC","note":"5.3 mg/dL is in range but under the 5.5 this framework prefers."},{"marker":"Vitamin D","note":"47 ng/mL is in the target window."}],"takeaway":"Three nutrient markers under the framework's targets, all cheap to move and easy to re-measure in six months.","ask_your_doctor":"Is there a reason not to raise omega-3 intake and iron, and should we recheck ferritin sooner than the next panel?","confidence":"high"},{"id":"means","headline":"Glucose 87, insulin 4.2 and triglycerides 71 describe good mitochondrial and metabolic health; the lipid numbers are a separate problem.","focus":[{"marker":"Glucose","note":"87 mg/dL fasting is near the 72 to 85 band Means's framework wants and has not drifted."},{"marker":"Insulin","note":"4.2 uIU/mL meets the under-5 target; HOMA-IR works out to about 0.9."},{"marker":"Triglycerides","note":"71 mg/dL with HDL 58 gives a TG to HDL ratio of 1.2, a healthy value."},{"marker":"Uric Acid","note":"5.5 mg/dL, mid-range."}],"takeaway":"Nothing here suggests cellular energy dysfunction. This framework would say the metabolic engine is sound and the lipid issue needs its own plan.","ask_your_doctor":"Given the metabolic markers are clean, what explains the ApoB, and does family history point at a genetic lipid pattern?","confidence":"high"},{"id":"barzilai","headline":"Biological age 44.3, HbA1c 5.5 and hs-CRP 0.4 are the aging markers this framework watches, and all three are moving the right way.","focus":[{"marker":"Biological Age","note":"44.3 years against a 51.8 reference ceiling, down from 47.9 two years ago."},{"marker":"Hemoglobin A1c (HbA1c)","note":"5.5% is flat; this framework reads stable glucose control as a pillar of slowing aging."},{"marker":"High-Sensitivity C-Reactive Protein (hs-CRP)","note":"0.4 mg/L, low inflammatory burden."},{"marker":"Creatinine-Based Estimated Glomerular Filtration Rate (eGFR)","note":"87 mL/min, kidney function holding across five draws."}],"takeaway":"The geroscience markers are favorable. The lipid trend is the one thing this framework would want managed so it does not undo the rest.","ask_your_doctor":"Are there any geroprotective trials or approaches you would consider appropriate for someone with this profile?","confidence":"medium"}],"research":{"Which areas of my health deserve the most focus right now, and why?":"**Lipoproteins first.** ApoB is 108 mg/dL against a Function range under 90, and LDL particle number is 1650 nmol/L against under 1138. Both have risen since Apr 2025 (98 and 1420). Lp(a) at 18 nmol/L is low, so this is not an inherited Lp(a) pattern. Large cohort data (the Copenhagen and UK Biobank analyses) tie lifetime ApoB exposure to plaque, which is why most longevity-focused frameworks want ApoB well under the lab range.\n\n**Two smaller threads.** Ferritin is 34 ng/mL, below range and falling from 52 in Oct 2024, with normal iron saturation. Omega-3 index is 5.4%, just under Function's floor and well under the 8% most frameworks target.\n\n**What is already working.** HbA1c 5.5%, fasting insulin 4.2 uIU/mL, triglycerides 71 mg/dL, hs-CRP 0.4 mg/L and a biological age of 44.3 years are all in good shape, so the lipid problem is not being driven by metabolic dysfunction.\n\n- Ask: what is the plan to bring ApoB down, and would imaging change its urgency?\n- Ask: why is ferritin falling with normal saturation?","What does my Apolipoprotein B of 108 mg/dL mean, and what moves it?":"ApoB counts every particle that can carry cholesterol into the artery wall (LDL, VLDL, IDL, Lp(a)), one ApoB per particle. Your 108 mg/dL is above Function's under-90 range and your particle number (1650 nmol/L) agrees, so this is a real particle-count problem rather than a quirk of LDL-C.\n\n**History.** 121 (Oct 2024), 98 (Apr 2025), 107, 112, 108. The Apr 2025 dip and the climb back suggest something changed around then; that is worth reconstructing.\n\n**What moves it.** Saturated fat intake and dietary pattern shift ApoB modestly (often 10 to 15%). Weight loss helps when there is weight to lose. Pharmacologic options (statins, ezetimibe, bempedoic acid, PCSK9 inhibitors) move it far more and are the subject of the large outcome trials (IMPROVE-IT, FOURIER, CLEAR Outcomes). Which, if any, is appropriate is a conversation with your clinician, not a number this app can give you.\n\n- Ask: what ApoB target fits my risk, and how do we get there?","What does my LDL Particle Number of 1650 nmol/L mean, and what moves it?":"LDL-P counts LDL particles directly by NMR. 1650 nmol/L is above Function's under-1138 range and roughly in the 80th percentile of the reference population. Your small LDL fraction (271 nmol/L, above range) and peak size (222.0 Angstrom, just under range) say the particles skew small, which raises risk per particle.\n\n**History.** 1890 (Oct 2024), 1420, 1560, 1610, 1650. Same shape as ApoB, which is expected because they measure the same thing two ways.\n\n**What moves it.** The same levers as ApoB. Small-particle share also responds to lowering triglycerides and refined carbohydrate, though yours are already low (71 mg/dL), so there is less to gain there than usual.\n\n- Ask: is there a reason to prefer LDL-P or ApoB as the number we track, and what target?","Why might my ferritin keep running low?":"Ferritin is 34 ng/mL against a 38 to 380 range and has fallen on most draws: 52, 41, 36, 39, 34. Iron (90 mcg/dL), binding capacity (327) and saturation (28%) are normal, and hemoglobin is 15.0 g/dL, so this is low stores without anemia.\n\n**Common explanations** for that pattern in men: regular blood donation, endurance training (foot-strike hemolysis and gut losses), low dietary heme iron, reduced absorption (low stomach acid, celiac disease, H. pylori), or slow gastrointestinal loss. Guidelines treat a falling ferritin in an adult man as something to explain rather than just supplement, because GI loss needs ruling out.\n\n- Ask: do I donate blood or train hard enough to explain this, and if not, what tests rule out GI loss and absorption problems?","How far is my omega-3 index from where the experts want it?":"Your omega-3 index is 5.4% (EPA 0.8, DHA 3.8), just under Function's 5.5% floor. It has climbed from 4.6% in Oct 2024. Rhonda Patrick's and Dale Bredesen's frameworks target 8% or higher, with cohort data (the Framingham offspring analysis and a 2021 pooled analysis of 17 cohorts) associating indexes around 8% with lower all-cause and cardiovascular mortality than indexes near 4%.\n\nYour omega-6 to omega-3 ratio (5.6) has also improved from 6.9. The index typically responds within three to four months to a sustained change in EPA and DHA intake.\n\n- Ask: is there any reason, such as bleeding risk or medications, not to raise EPA and DHA intake?","What would each of my experts want me to ask my doctor next?":"- **Attia:** what is the plan to bring ApoB under 70, and would a calcium score or CCTA change how aggressive it should be?\n- **Hyman:** should we look for a source of iron loss, and would an MTHFR test explain homocysteine at 11.2?\n- **Bredesen:** would you support targets of homocysteine under 7 and omega-3 index over 8, and is APOE genotype worth knowing?\n- **Patrick:** can we recheck ferritin sooner than the next panel after raising intake?\n- **Means:** with clean metabolic markers, does family history point at a genetic lipid pattern?\n- **Huberman:** is an evening cortisol worth adding to see the full daily curve?\n- **Longo and Barzilai:** is IGF-1 worth adding so growth signaling can be read alongside biological age?\n- **Sinclair:** does the lipid picture change how we read the biological age estimate?"}}};</script>

        return { date: String(r.date).slice(0, 10), t: toTs(r.date), raw: String(r.raw).trim(), v: n ? n.v : null, q: n ? n.q : '', inRange: r.inRange };
      }).sort((a, b) => a.t - b.t);
      const numeric = pts.length > 0 && pts.filter(q => q.v != null).length >= Math.max(1, Math.ceil(pts.length * 0.6)) && pts[pts.length - 1].v != null;
      const status = String(rg.status || '').toLowerCase();
      let state = 'other';
      if (d.is_neutral || status === 'neutral' || status === 'error') state = 'other';
      else if (rg.is_in_range === false) state = status === 'below' ? 'low' : 'high';
      else if (rg.is_in_range === true) state = 'ok';
      const m = {
        id: d.biomarker_id || ('m' + i),
        name: String(d.biomarker_name || 'Marker').trim(),
        cat: (Array.isArray(d.category) && d.category[0]) || 'Other',
        desc: d.description || '',
        unit: res.units || '',
        rangeStr: (rg.range_string || '').trim(),
        rmin, rmax, state, status,
        improving: d.comparison ? d.comparison.is_improving : null,
        pts, numeric,
        latest: pts[pts.length - 1] || null,
        prev: pts.length > 1 ? pts[pts.length - 2] : null,
        latestDate: d.date_of_service ? String(d.date_of_service).slice(0, 10) : null
      };
      m.pointState = pt => {
        if (pt.v != null && (m.rmin != null || m.rmax != null) && m.state !== 'other') {
          if (m.rmax != null && pt.v > m.rmax) return 'high';
          if (m.rmin != null && pt.v < m.rmin) return 'low';
          return 'ok';
        }
        if (pt.inRange === false) return 'high';
        if (pt.inRange === true && m.state !== 'other') return 'ok';
        return 'other';
      };
      return m;
    }).filter(m => m.pts.length);

    // Cluster draw dates within 10 days into one draw column
    const dates = [...new Set(markers.flatMap(m => m.pts.map(q => q.date)))].sort();
    const draws = [];
    dates.forEach(d => {
      const t = toTs(d), last = draws[draws.length - 1];
      if (last && t - last.t1 <= 10 * 864e5) { last.t1 = t; last.dates.push(d); }
      else draws.push({ t0: t, t1: t, dates: [d] });
    });
    draws.forEach(dr => { dr.label = fmtMonth(dr.t1); dr.set = new Set(dr.dates); });
    markers.forEach(m => { m.byDraw = draws.map(dr => { const hit = m.pts.filter(q => dr.set.has(q.date)); return hit.length ? hit[hit.length - 1] : null; }); });

    const latestTs = markers.reduce((a, m) => Math.max(a, m.latest ? m.latest.t : 0), 0);
    const counts = {
      total: fnum(s.total) ?? markers.length,
      inRange: fnum(s.in_range) ?? markers.filter(m => m.state === 'ok').length,
      out: fnum(s.out_of_range) ?? markers.filter(m => m.state === 'high' || m.state === 'low').length,
      other: fnum(s.other) ?? markers.filter(m => m.state === 'other').length
    };
    const cats = [...new Set(markers.map(m => m.cat))].sort((a, b) => {
      const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
    });
    return { markers, draws, latestTs, counts, cats };
  }

  // ── Robust smoothing spline (Healthwise trend, 4.0 df) ──────────────
  function robustSpline(pts, opts = {}) {
    const P = pts.filter(p => isFinite(p.x) && isFinite(p.y)).slice().sort((a, b) => a.x - b.x);
    const D = [];
    P.forEach(p => { const last = D[D.length - 1]; if (last && p.x - last.x < 1) { last.y = (last.y * last.c + p.y) / (last.c + 1); last.c++; } else D.push({ x: p.x, y: p.y, c: 1 }); });
    const n = D.length;
    if (n < 4) return null;
    const X = D.map(p => p.x / 365.25), Y = D.map(p => p.y);
    const h = []; for (let i = 0; i < n - 1; i++) h.push(X[i + 1] - X[i]);
    const m = n - 2;
    const Q = Array.from({ length: n }, () => new Array(m).fill(0));
    const R = Array.from({ length: m }, () => new Array(m).fill(0));
    for (let j = 1; j <= n - 2; j++) {
      const c = j - 1;
      Q[j - 1][c] = 1 / h[j - 1]; Q[j][c] = -1 / h[j - 1] - 1 / h[j]; Q[j + 1][c] = 1 / h[j];
      R[c][c] = (h[j - 1] + h[j]) / 3;
      if (c + 1 < m) { R[c][c + 1] = h[j] / 3; R[c + 1][c] = h[j] / 3; }
    }
    const solve = (A, B) => {
      const k = A.length, r = B[0].length, M = A.map((row, i) => row.concat(B[i]));
      for (let col = 0; col < k; col++) {
        let piv = col; for (let i = col + 1; i < k; i++) if (Math.abs(M[i][col]) > Math.abs(M[piv][col])) piv = i;
        [M[col], M[piv]] = [M[piv], M[col]];
        const d = M[col][col] || 1e-12;
        for (let i = 0; i < k; i++) if (i !== col) { const f = M[i][col] / d; if (f) for (let jj = col; jj < k + r; jj++) M[i][jj] -= f * M[col][jj]; }
      }
      return M.map((row, i) => row.slice(k).map(v => v / (M[i][i] || 1e-12)));
    };
    const QT = Q[0].map((_, c) => Q.map(row => row[c]));
    const RinvQT = solve(R, QT);
    const K = Q.map(row => RinvQT[0].map((_, j) => row.reduce((s, q, c) => s + q * RinvQT[c][j], 0)));
    const fit = (w, lam) => {
      const A = K.map((row, i) => row.map((v, j) => lam * v + (i === j ? w[i] : 0)));
      const Sm = solve(A, w.map((wi, i) => w.map((_, j) => (i === j ? wi : 0))));
      return { g: Sm.map(row => row.reduce((s, v, j) => s + v * Y[j], 0)), df: Sm.reduce((s, row, i) => s + row[i], 0) };
    };
    const dfTarget = opts.df || 4;
    const fitDf = w => { let lo = -8, hi = 8, best = null; for (let it = 0; it < 40; it++) { const mid = (lo + hi) / 2, r = fit(w, Math.pow(10, mid)); best = r; if (r.df > dfTarget) lo = mid; else hi = mid; } return best; };
    const med = a => { const s = [...a].sort((p, q) => p - q), k = s.length >> 1; return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2; };
    const yScale = Math.max(1e-9, 0.05 * med(Y.map(Math.abs)));
    let w = new Array(n).fill(1), res = null;
    for (let it = 0; it < 6; it++) {
      res = fitDf(w);
      const r = Y.map((y, i) => y - res.g[i]);
      const s = Math.max(1.4826 * med(r.map(Math.abs)), yScale);
      const nw = r.map(ri => { const u = ri / (4.685 * s); return Math.abs(u) < 1 ? Math.pow(1 - u * u, 2) : 0; }).map(v => Math.max(v, 0.01));
      const delta = nw.reduce((s2, v, i) => s2 + Math.abs(v - w[i]), 0);
      w = nw; if (delta < 1e-3) break;
    }
    const lo = Math.min(...Y), hi2 = Math.max(...Y);
    const g = res.g.map(v => Math.min(hi2, Math.max(lo, v)));
    const dk = []; for (let i = 0; i < n - 1; i++) dk.push((g[i + 1] - g[i]) / h[i]);
    const tg = new Array(n).fill(0); tg[0] = dk[0]; tg[n - 1] = dk[n - 2];
    for (let i = 1; i < n - 1; i++) { if (dk[i - 1] * dk[i] <= 0) { tg[i] = 0; continue; } const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1]; tg[i] = (w1 + w2) / (w1 / dk[i - 1] + w2 / dk[i]); }
    for (let i = 0; i < n - 1; i++) if (dk[i] === 0) { tg[i] = 0; tg[i + 1] = 0; }
    return xDays => {
      const t = xDays / 365.25;
      if (t <= X[0]) return g[0]; if (t >= X[n - 1]) return g[n - 1];
      let i = 0; while (i < n - 2 && t > X[i + 1]) i++;
      const hh = h[i], u = (t - X[i]) / hh, u2 = u * u, u3 = u2 * u;
      return (2 * u3 - 3 * u2 + 1) * g[i] + (u3 - 2 * u2 + u) * hh * tg[i] + (-2 * u3 + 3 * u2) * g[i + 1] + (u3 - u2) * hh * tg[i + 1];
    };
  }
  function trendFor(m) {
    const num = m.pts.filter(p => p.v != null);
    if (num.length < 4) return null;
    const t0 = num[0].t;
    const f = robustSpline(num.map(p => ({ x: (p.t - t0) / 864e5, y: p.v })), { df: Math.min(TREND_DF, num.length - 1) });
    return f ? { f, t0 } : null;
  }
  const markColor = st => st === 'high' ? 'var(--high-mark)' : st === 'low' ? 'var(--low-mark)' : st === 'ok' ? 'var(--ok-mark)' : 'var(--neutral-mark)';

  // ── SVG pieces ───────────────────────────────────────────────────────
  function sparkline(m, w = 96, h = 28) {
    const num = m.pts.filter(p => p.v != null);
    if (num.length < 2) return '<span class="c-muted">·</span>';
    const t0 = num[0].t, t1 = num[num.length - 1].t;
    let lo = Math.min(...num.map(p => p.v)), hi = Math.max(...num.map(p => p.v));
    if (hi === lo) { hi += 1; lo -= 1; }
    const pad = 4, X = t => pad + (t - t0) / ((t1 - t0) || 1) * (w - pad * 2), Y = v => h - pad - (v - lo) / (hi - lo) * (h - pad * 2);
    const line = num.map(p => `${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
    let trend = '';
    const tr = trendFor(m);
    if (tr) {
      const pts = []; for (let k = 0; k <= 40; k++) { const t = t0 + (t1 - t0) * k / 40; pts.push(`${X(t).toFixed(1)},${Y(tr.f((t - tr.t0) / 864e5)).toFixed(1)}`); }
      trend = `<polyline points="${pts.join(' ')}" fill="none" stroke="${markColor(m.state)}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    const last = num[num.length - 1];
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${line}" fill="none" stroke="var(--reading)" stroke-width="1.1" stroke-dasharray="1.5 3" stroke-linecap="round"/>${trend}${num.map(p => `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${p === last ? 3 : 1.7}" fill="${p === last ? markColor(m.pointState(p)) : 'var(--reading)'}"/>`).join('')}</svg>`;
  }

  function rangeBar(m) {
    const v = m.latest && m.latest.v, pv = m.prev && m.prev.v;
    if (v == null || (m.rmin == null && m.rmax == null)) return '';
    const vals = [v, pv, m.rmin, m.rmax].filter(x => x != null);
    let lo, hi;
    if (m.rmin != null && m.rmax != null) { const span = m.rmax - m.rmin; lo = Math.min(m.rmin - span * 0.35, ...vals); hi = Math.max(m.rmax + span * 0.35, ...vals); }
    else if (m.rmax != null) { lo = Math.min(0, ...vals); hi = Math.max(m.rmax * 1.5, ...vals.map(x => x * 1.12)); }
    else { lo = Math.min(0, ...vals.map(x => x * 0.85)); hi = Math.max(m.rmin * 2, ...vals.map(x => x * 1.15)); }
    if (hi <= lo) hi = lo + 1;
    const X = x => Math.max(0, Math.min(100, (x - lo) / (hi - lo) * 100));
    const a = m.rmin != null ? X(m.rmin) : 0, b = m.rmax != null ? X(m.rmax) : 100;
    const seg = (x1, x2, fill) => x2 > x1 ? `<rect x="${x1}%" y="7" width="${x2 - x1}%" height="4" rx="2" fill="${fill}"/>` : '';
    const st = m.state;
    return `<div class="rangebar"><svg aria-hidden="true">${seg(0, a, 'var(--low-line)')}${seg(a, b, 'var(--ok-line)')}${seg(b, 100, 'var(--high-line)')}${pv != null ? `<line x1="${X(pv)}%" x2="${X(pv)}%" y1="4" y2="14" stroke="var(--reading)" stroke-width="1.4"/>` : ''}<circle cx="${X(v)}%" cy="9" r="5" fill="${markColor(st)}" stroke="var(--inner)" stroke-width="1.5"/></svg></div>`;
  }

  function niceTicks(lo, hi, n = 4) {
    const span = hi - lo || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
    const step = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
    const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-6; v += step) out.push(+v.toFixed(10));
    return out;
  }

  function fullChart(m, width) {
    const num = m.pts.filter(p => p.v != null);
    const W = Math.max(300, Math.round(width)), H = width >= 800 ? 410 : 300, ml = 50, mr = 20, mt = 26, mb = 34;
    const t0 = num[0].t, t1 = num[num.length - 1].t, tpad = Math.max((t1 - t0) * 0.05, 20 * 864e5);
    const ta = t0 - tpad, tb = t1 + tpad;
    const vs = num.map(p => p.v).concat([m.rmin, m.rmax].filter(x => x != null));
    let lo = Math.min(...vs), hi = Math.max(...vs);
    const pad = (hi - lo) * 0.18 || Math.abs(hi) * 0.2 || 1;
    lo = lo - pad; hi = hi + pad;
    if (Math.min(...num.map(p => p.v)) >= 0 && lo < 0) lo = 0;
    const ticks = niceTicks(lo, hi, 4); lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
    const X = t => ml + (t - ta) / (tb - ta) * (W - ml - mr), Y = v => mt + (1 - (v - lo) / (hi - lo)) * (H - mt - mb);
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.name)} over time">`;
    // reference band
    if (m.rmin != null || m.rmax != null) {
      const y1 = Y(m.rmax != null ? Math.min(m.rmax, hi) : hi), y2 = Y(m.rmin != null ? Math.max(m.rmin, lo) : lo);
      svg += `<rect x="${ml}" y="${y1.toFixed(1)}" width="${W - ml - mr}" height="${Math.max(0, y2 - y1).toFixed(1)}" fill="var(--ok-band)"/>`;
    }
    ticks.forEach(v => { const y = Y(v); svg += `<line x1="${ml}" x2="${W - mr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)"/><text x="${ml - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--dim)" class="num">${esc(fmtNum(v))}</text>`; });
    // x ticks: each draw month, thinned
    const xt = []; const seen = new Set();
    num.forEach(p => { const lab = fmtMonth(p.t); if (!seen.has(lab)) { seen.add(lab); xt.push({ t: p.t, lab }); } });
    let lastX = -1e9;
    xt.forEach(k => { const x = X(k.t); if (x - lastX < 62) return; lastX = x; svg += `<text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--dim)">${esc(k.lab)}</text>`; });
    // readings (dotted)
    svg += `<polyline points="${num.map(p => `${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--reading)" stroke-width="1.4" stroke-dasharray="2 4" stroke-linecap="round"/>`;
    // trend (solid)
    const tr = trendFor(m);
    if (tr) {
      const pts = []; for (let k = 0; k <= 120; k++) { const t = t0 + (t1 - t0) * k / 120; pts.push(`${X(t).toFixed(1)},${Y(tr.f((t - tr.t0) / 864e5)).toFixed(1)}`); }
      svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="${markColor(m.state)}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    // dots + labels
    num.forEach((p, i) => {
      const x = X(p.t), y = Y(p.v), st = m.pointState(p), isLast = i === num.length - 1;
      svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isLast ? 6.5 : 5}" fill="${markColor(st)}" stroke="var(--surface)" stroke-width="2"><title>${esc(fmtDate(p.t))}: ${esc(p.raw)} ${esc(m.unit)}</title></circle>`;
      const ly = y - 11 < mt ? y + 18 : y - 11;
      svg += `<text x="${x.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="${W >= 800 ? 12.5 : 11}" font-weight="${isLast ? 600 : 500}" fill="var(--text)" class="num">${esc(p.raw)}</text>`;
    });
    return svg + '</svg>';
  }

  // ── Derived views of the data ────────────────────────────────────────
  const fmtVal = (p, m) => p ? `${esc(p.raw)}` : '';
  function deltaText(m) {
    if (!m.latest || !m.prev || m.latest.v == null || m.prev.v == null) return '';
    const d = pct(m.latest.v, m.prev.v); if (d == null || !isFinite(d)) return '';
    const arrow = d > 0.5 ? '↑' : d < -0.5 ? '↓' : '→';
    return `${arrow} ${Math.abs(d).toFixed(0)}% since ${fmtMonth(m.prev.t)}`;
  }
  function offRange(m) {
    const v = m.latest && m.latest.v; if (v == null) return '';
    if (m.state === 'high' && m.rmax) return `+${Math.round((v - m.rmax) / m.rmax * 100)}% over`;
    if (m.state === 'low' && m.rmin) return `${Math.round((v - m.rmin) / m.rmin * 100)}% under`;
    return m.state === 'high' || m.state === 'low' ? 'Flagged' : '';
  }
  function margin(m) {
    const v = m.latest && m.latest.v; if (v == null || m.state !== 'ok') return '';
    const ds = [];
    if (m.rmax) ds.push((m.rmax - v) / m.rmax); if (m.rmin) ds.push((v - m.rmin) / m.rmin);
    if (!ds.length) return '';
    return `${Math.max(0, Math.round(Math.min(...ds) * 100))}% margin`;
  }
  function tile(m) {
    const st = m.state === 'other' ? '' : m.state;
    const top = st === 'ok' ? margin(m) : offRange(m);
    const dt = deltaText(m);
    const trendWord = (m.state === 'high' || m.state === 'low') && m.improving != null && m.prev ? (m.improving ? 'improving' : 'worsening') : '';
    return `<button class="tile ${st}" type="button" data-marker="${esc(m.id)}">
      <span class="t-top"><span class="nm">${esc(m.name)}</span><span class="delta c-${st || 'muted'}">${esc(top)}</span></span>
      <span class="val num c-${st || 'muted'}">${esc(m.latest.raw)}<span class="u">${esc(m.unit)}</span></span>
      ${rangeBar(m)}
      <span class="foot num">${esc([dt || (m.rangeStr ? 'Function range ' + m.rangeStr : ''), trendWord].filter(Boolean).join(' · '))}</span>
    </button>`;
  }

  // ── Views ────────────────────────────────────────────────────────────
  function head(title, sub, right = '') {
    return `<header class="page-head"><div><div class="edition">Healthwise <b>· for Function</b></div><h1>${esc(title)}</h1><p class="sub">${sub}</p></div>${right}</header>${DEMO && title !== 'Research' ? `<div class="demo-bar"><b>Demo</b><span>Sample results for a fictional member. Expert reviews and research answers are pre-written. The live version connects to your own Function account.</span></div>` : ''}`;
  }
  function refreshBtn() {
    if (DEMO) return `<span class="demo-pill">Sample data</span>`;
    return `<div class="gate actions" style="margin:0"><span class="note num">${esc(S.refreshNote)}</span><button class="btn" type="button" id="refresh-btn">${icon.refresh}Refresh from Function</button></div>`;
  }
  function loadedLine() {
    const d = S.data;
    return `Latest Function draw ${esc(fmtDate(d.latestTs))} · ${d.draws.length} draws since ${esc(fmtMonth(d.draws[0].t0))} · ${DEMO ? 'sample data, nothing saved' : 'read live from Function, nothing saved'}`;
  }

  function gateView(title) {
    const c = S.conn;
    let body = '';
    if (c === 'booting' || c === 'connecting') {
      body = `<div class="thinking"><div class="spinner"></div>${c === 'booting' ? 'Starting up…' : 'Reading your results from Function…'}</div>`;
    } else if (c === 'needs-claude') {
      body = `<h2>Open this page in Claude</h2><p>Healthwise for Function reads your results through Claude's Function Health connection, so it only works when this page is opened inside Claude while you're signed in.</p>`;
    } else {
      const err = S.connError;
      body = `<h2>See your Function results clearly</h2>
        <p>Healthwise charts every Function biomarker over time and lets the experts you choose explain what your numbers mean.</p>
        <ol class="steps">
          <li><span class="n">1</span><span>Make sure <b>Function Health</b> is connected to Claude. In Function, it's under Settings → Apps &amp; Devices → Claude. In Claude, it's under <a href="https://claude.ai/settings/connectors" target="_blank" rel="noopener">Settings → Connectors</a>.</span></li>
          <li><span class="n">2</span><span>Press <b>Connect Function Health</b> and allow this page to read it when Claude asks.</span></li>
        </ol>
        ${err ? `<p class="note warn" role="alert">${esc(err)}</p>` : ''}
        <div class="actions"><button class="btn primary" type="button" id="connect-btn">Connect Function Health</button>${perms ? '<button class="btn ghost" type="button" id="perm-btn">Manage permissions</button>' : ''}</div>`;
    }
    return `${head(title, 'Your Function results, read live')}<section class="gate"><div class="module">${body}
      <div class="privacy">${icon.shield}<span>Healthwise has no database and keeps no copy of your health data. Your results load from Function through Claude each time you open this page. Claude only reads them when you ask your experts for a review.</span></div></div></section>`;
  }

  function homeView() {
    const d = S.data, ms = d.markers;
    const flagged = ms.filter(m => m.state === 'high' || m.state === 'low').sort((a, b) => (a.cat === 'Heart' ? -1 : 0) - (b.cat === 'Heart' ? -1 : 0));
    const c = d.counts, tot = c.inRange + c.out + c.other || 1;
    const bio = ms.find(m => /biological age/i.test(m.name));

        <div id="chat-input-bar"><div id="chat-input-wrap"><textarea id="chat-textarea" placeholder="${localOff ? 'Start the on-device model to ask a question…' : 'Ask a medical research question…'}" rows="2" aria-label="Your question" ${localOff ? 'disabled' : ''}></textarea><button id="chat-send" type="button" title="Send" aria-label="Send" ${RS.busy || localOff ? 'disabled' : ''}><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 14L14 8 2 2v5l8 1-8 1v5z"/></svg></button></div><div id="chat-disclaimer">Not medical advice. Always consult your physician. ${DEMO ? 'Demo answers are pre-written for sample data.' : rsUseLocal() ? 'Answered on this Mac from your data, no web search.' : 'Answers come from Claude\'s knowledge, not a live search.'}</div></div>
      </section>

  }
  function rsRenderThreadOnly() {
    const conv = rsActive(), el = $('#chat-messages'); if (!el || !conv) return;

  }
  async function rsSend(text) {
    text = String(text || '').trim(); if (!text || !S.data || RS.busy) return;
    if (!DEMO && !rsUseLocal() && !sampleFn) { toast('Research needs Claude. Open the page in Claude while signed in.'); return; }
    let conv = rsActive();
    if (!conv) { conv = { id: 'c' + Date.now(), title: text.length > 60 ? text.slice(0, 57) + '…' : text, at: Date.now(), messages: [] }; RS.convs.unshift(conv); RS.activeId = conv.id; }
    conv.messages.push({ role: 'user', content: text });
    const reply = { role: 'assistant', content: '', pending: true }; conv.messages.push(reply);
    RS.busy = true; render();
    const turns = [{ role: 'user', content: rsContext() + '\n\n' + RS_RULES }];
    conv.messages.slice(0, -1).forEach(m => { if (m.content) turns.push({ role: m.role, content: m.content }); });
    reviewCtl = new AbortController();
    if (DEMO) {
      await new Promise(r => setTimeout(r, 1100));
      const canned = window.HW_DEMO.reviews.research[text.trim()];
      reply.content = canned || 'In this demo the answers are pre-written for the suggested questions above. In the live version, Claude reads your own Function results and answers any question.';
      reply.pending = false; reviewCtl = null; RS.busy = false;
      if (S.view === 'research') render();
      return;
    }
    if (rsUseLocal()) {
      try {
        const r = await mcp.callTool(LOCAL_SERVER, 'answer', { question: text, history: conv.messages.slice(0, -2).filter(m => m.content).map(m => ({ role: m.role, content: m.content })), core: rsContext() }, { signal: reviewCtl.signal, cache: false });
        const pl = r.payload && typeof r.payload === 'object' ? r.payload : { text: String(r.payload || '') };
        reply.content = pl.text || 'The on-device model returned nothing.'; reply.local = true; reply.sources = Array.isArray(pl.sources) ? pl.sources.length : 0;
      } catch (e) {
        const code = e && e.code;
        if (code === 'server_not_connected' || code === 'needs_reauth') RS.local = 'off';
        reply.content = ({ cancelled: 'Stopped.', server_not_connected: 'The Healthwise helper isn\'t reachable. Open this page in the Claude desktop app with the helper running, or pick Claude.', approval_required: 'Claude needs your approval to use the helper. Allow it when asked and send again.', tool_error: 'The on-device model couldn\'t answer this one. Apple\'s safety filter sometimes refuses medical questions; try Claude for this question.' })[code] || 'The on-device model didn\'t respond. Ask again or pick Claude.';
      }
      reply.pending = false; reviewCtl = null; RS.busy = false;
      if (S.view === 'research') { render(); const ta = $('#chat-textarea'); if (ta) ta.focus(); }
      return;
    }
    try {
      const res = await sampleFn(turns, { signal: reviewCtl.signal, modelTier: rsIsLocal() ? 'default' : RS.model, cache: false,
        onText: ({ text: t }) => { reply.pending = false; reply.content = t; const b = $(`#chat-messages .chat-msg[data-idx="${conv.messages.length - 1}"] .chat-bubble`); if (b) { b.innerHTML = formatReply(t); $('#chat-messages').scrollTop = $('#chat-messages').scrollHeight; } } });
      reply.content = res.text; reply.pending = false;
    } catch (e) {
      const code = e && e.code;
      reply.pending = false;
      reply.content = e && e.text ? e.text : ({ cancelled: 'Stopped.', not_granted: 'Claude wasn\'t allowed to run for this page. Allow it when asked.', rate_limited: 'You\'ve reached a Claude usage limit. Try again a little later.', session_expired: 'Your Claude session expired. Sign in again and retry.', refused: 'Claude declined this question. Try rephrasing it.', prompt_too_large: 'This conversation is too long for one call. Start a new conversation.' })[code] || 'Claude didn\'t respond. Ask again.';
    }
    reviewCtl = null; RS.busy = false;
    if (S.view === 'research') { render(); const ta = $('#chat-textarea'); if (ta) ta.focus(); }
  }
  async function rsCheckLocal(force) {
    if (DEMO) { RS.local = 'off'; return; }
    if (!rsIsLocal()) return;
    if (!force && RS.local !== 'unknown') return;
    if (!mcp) { RS.local = 'off'; return render(); }
    RS.local = 'checking'; render();
    try { await mcp.callTool(LOCAL_SERVER, 'status', {}, { signal: AbortSignal.timeout ? AbortSignal.timeout(6000) : undefined, cache: false }); RS.local = 'on'; }
    catch (e) { RS.local = (e && e.code === 'approval_required') ? 'off' : 'off'; }

  }
  function rsOpenContext() {
    if (RS.details && RS.details.kind === 'ctx') { RS.details = null; return render(); }
    RS.details = { kind: 'ctx', title: 'Your data in context', html: `<div class="rs-det-note">Built live from your Function results each time this page opens. Claude gets all of it with every question, together with your experts' frameworks. Nothing is stored by Healthwise.</div><pre class="rs-ctx">${esc(rsContext())}</pre>` };

  }

  // ── Render ───────────────────────────────────────────────────────────
  function render() {
    const v = S.view, el = $('#view');
    document.querySelectorAll('.nav-btn[data-view]').forEach(b => { if (b.dataset.view === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    const ld = $('.nav-btn .lock-dot'); if (ld) { if (UNLOCKED) ld.setAttribute('hidden', ''); else ld.removeAttribute('hidden'); }
    const titles = { home: 'Dashboard', labs: 'Labs', advisor: 'Advisor', research: 'Research' };
    if (v === 'research') { el.innerHTML = researchView(); if (UNLOCKED && S.data && rsIsLocal() && RS.local === 'unknown') rsCheckLocal(false); }
    else if (!S.data) el.innerHTML = gateView(titles[v]);
    else el.innerHTML = v === 'labs' ? labsView() : v === 'advisor' ? advisorView() : homeView();
    // Keep the latest draw in view on narrow screens
    if (v === 'labs' && S.data) el.querySelectorAll('.table-wrap').forEach(w => { w.scrollLeft = w.scrollWidth; });
  }
  function go(view, opts = {}) {
    S.view = view;
    if (opts.cat) { S.labs.cat = opts.cat; S.labs.flagged = false; }
    if (opts.flagged) { S.labs.flagged = true; S.labs.cat = 'All'; }

    render();
    window.scrollTo(0, 0);
  }

  // ── Chart dialog ─────────────────────────────────────────────────────
  function openMarker(id) {
    const m = S.data && S.data.markers.find(x => x.id === id);
    if (!m) return;
    const dlg = $('#chart-dlg');
    $('#dlg-title').textContent = m.name;
    $('#dlg-meta').textContent = `${m.cat}${m.unit ? ' · ' + m.unit : ''}${m.rangeStr ? ' · Function range ' + m.rangeStr : ''}`;
    const st = m.state;
    const stats = `<div class="dlg-stats num"><div>Latest<b class="c-${st === 'other' ? 'muted' : st}">${esc(m.latest.raw)} <span style="font-size:12px;font-weight:400" class="c-muted">${esc(m.unit)}</span></b>${esc(fmtDate(m.latest.t))}</div>
      ${m.prev ? `<div>Previous<b>${esc(m.prev.raw)}</b>${esc(fmtDate(m.prev.t))}</div>` : ''}
      <div>Status<b class="c-${st === 'other' ? 'muted' : st}">${st === 'high' ? 'Above range' : st === 'low' ? 'Below range' : st === 'ok' ? 'In range' : 'Informational'}</b>${esc(offRange(m) || margin(m))}</div>
      <div>Draws<b>${m.pts.length}</b>since ${esc(fmtMonth(m.pts[0].t))}</div></div>`;
    let chart;
    const numCount = m.pts.filter(p => p.v != null).length;
    if (m.numeric && numCount >= 2) {
      chart = `<div class="chart-box" id="chart-box"></div><div class="chart-legend"><span><svg width="22" height="6" aria-hidden="true"><line x1="1" y1="3" x2="21" y2="3" stroke="var(--reading)" stroke-width="1.6" stroke-dasharray="2 3.5" stroke-linecap="round"/></svg>Readings</span>${trendFor(m) ? `<span><svg width="22" height="6" aria-hidden="true"><line x1="1" y1="3" x2="21" y2="3" stroke="${markColor(st)}" stroke-width="2.4" stroke-linecap="round"/></svg>Trend</span>` : ''}${m.rmin != null || m.rmax != null ? `<span><svg width="14" height="10" aria-hidden="true"><rect width="14" height="10" rx="2" fill="var(--ok-band)"/></svg>Function range</span>` : ''}</div>`;
    } else {
      chart = `<div class="qual-list num">${m.pts.slice().reverse().map(p => `<div><span class="c-muted">${esc(fmtDate(p.t))}</span><b class="c-${m.pointState(p) === 'other' ? 'muted' : m.pointState(p)}">${esc(p.raw)}</b></div>`).join('')}</div>`;
    }

  }
  $('#dlg-close').addEventListener('click', () => $('#chart-dlg').close());
  document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
  $('#unlock-dlg [data-close]').addEventListener('click', () => $('#unlock-dlg').close());
  $('#unlock-list').innerHTML = FULL_FEATURES.map(x => `<li>${icon.check}<span>${esc(x)}</span></li>`).join('');

  function openUnlock() { const d = $('#unlock-dlg'); $('#code-msg').textContent = UNLOCKED ? 'Full access is on for this browser.' : ''; try { d.showModal(); } catch { d.setAttribute('open', ''); } }
  async function sha256(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  $('#code-form').addEventListener('submit', async e => {

    if (!ok) { msg.textContent = 'That code didn\'t work.'; inp.select(); return; }

  // ── Events ───────────────────────────────────────────────────────────
  document.addEventListener('click', e => {
    const t = e.target.closest('button, [data-marker], [data-go]');
    if (!t) return;
    if (t.matches('.nav-btn[data-view]')) return go(t.dataset.view);
    if (t.id === 'theme-btn') return toggleTheme();
    if (t.hasAttribute('data-unlock')) return openUnlock();
    if (t.dataset.go) return go(t.dataset.go, { cat: t.dataset.cat, flagged: t.dataset.flagged });
    if (t.dataset.marker) return openMarker(t.dataset.marker);
    if (t.id === 'connect-btn') return connect();
    if (t.id === 'perm-btn') { perms && perms.manage().catch(() => toast('Open the artifact menu to manage permissions')); return; }
    if (t.id === 'refresh-btn') return refresh();
    if (t.id === 'flag-toggle') { S.labs.flagged = !S.labs.flagged; return render(); }
    if (t.dataset.catchip) { S.labs.cat = t.dataset.catchip; return render(); }
    if (t.dataset.expert) return toggleExpert(t.dataset.expert);
    if (t.id === 'review-btn') return runReview();
    if (t.id === 'stop-review') { reviewCtl && reviewCtl.abort(); return; }
    if (t.hasAttribute('data-rs-new')) { RS.activeId = null; RS.details = null; return render(); }
    if (t.hasAttribute('data-rs-recheck')) return rsCheckLocal(true);
    if (t.hasAttribute('data-rs-use-claude')) { RS.model = 'default'; store.set('hwf.rsModel', RS.model); return render(); }
    if (t.dataset.rsOpen) { RS.activeId = t.dataset.rsOpen; return render(); }
    if (t.hasAttribute('data-rs-clear')) { RS.convs = []; RS.activeId = null; return render(); }
    if (t.hasAttribute('data-rs-ctx')) return rsOpenContext();
    if (t.hasAttribute('data-rs-details-close')) { RS.details = null; return render(); }
    if (t.hasAttribute('data-rs-suggest')) return rsSend(t.textContent);

  });
  document.addEventListener('keydown', e => {

  });

  function toggleExpert(id) {
    const has = S.experts.includes(id);
    if (has) S.experts = S.experts.filter(x => x !== id);
    else if (S.experts.length >= FREE_EXPERTS) {

  let toastT = 0;

  // ── Theme ────────────────────────────────────────────────────────────

  // ── Function connection ──────────────────────────────────────────────
  const ERR = {
    server_not_connected: 'Function Health isn\'t connected to your Claude account yet. Add it in Claude under Settings → Connectors, then press Connect again.',
    needs_reauth: 'Your Function Health sign-in has expired. Reconnect it in Claude under Settings → Connectors, then press Connect again.',
    selection_required: 'You have more than one Function Health connection. Choose one when Claude asks, then press Connect again.',
    not_in_manifest: 'This page isn\'t allowed to read Function Health yet. Press Connect and choose Allow when Claude asks.',
    approval_required: 'Claude needs your approval to read Function Health. Press Connect and choose Allow.',
    consent_required: 'Claude needs your approval to read Function Health. Press Connect and choose Allow.',
    blocked_by_policy: 'Your organization\'s settings block this page from reading Function Health.',
    server_unavailable: 'Function didn\'t respond. Wait a moment and press Connect again.',
    server_not_found: 'The Function Health connection no longer exists. Add it again in Claude under Settings → Connectors.',
    tool_error: 'Function couldn\'t return your results. If you haven\'t completed a Function test yet, there\'s nothing to show.',
    not_granted: 'This view can\'t use connectors. Open the page in Claude while signed in.',
    capability_disabled: 'This view can\'t use connectors. Open the page in Claude while signed in.'
  };
  const errMsg = e => ERR[e && e.code] || `Something went wrong reading Function (${(e && e.code) || 'unknown'}). Press Connect to try again.`;

  function accept(result) {
    const payload = result && (result.payload ?? result.structuredContent);
    const data = normalize(payload);
    if (!data.markers.length) { S.conn = 'connect'; S.connError = 'Function returned no lab results for this account.'; S.data = null; render(); return false; }
    S.data = data; S.conn = 'ready'; S.connError = null;
    const at = result.cache && result.cache.storedAt ? result.cache.storedAt : Date.now();
    S.loadedAt = at;
    const d = new Date(at);
    S.refreshNote = `Loaded ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
    if (S.view !== 'advisor' || !S.review || S.review.status !== 'thinking') render();
    return true;
  }

  function startWatch() {
    if (unwatch || !mcp) return;
    try {
      unwatch = mcp.watchTool(SERVER, TOOL, INPUT, ev => {
        if (ev.type === 'data') accept(ev.result);
        else {
          const code = ev.error && ev.error.code;
          if (['needs_reauth', 'server_not_connected', 'blocked_by_policy', 'approval_required', 'not_in_manifest', 'selection_required', 'consent_required'].includes(code)) {
            S.data = null; S.conn = 'connect'; S.connError = errMsg(ev.error); stopWatch(); render();
          } else if (!S.data) {
            S.conn = 'connect'; S.connError = errMsg(ev.error); stopWatch(); render();
          } else {
            S.refreshNote = 'Couldn\'t refresh. Showing your last load.'; render();
          }
        }
      }, { cache: CACHE });
    } catch (e) { S.conn = 'connect'; S.connError = errMsg(e); render(); }
  }
  function stopWatch() { if (unwatch) { try { unwatch(); } catch {} unwatch = null; } }

  async function connect() {
    if (!mcp) return;
    S.conn = 'connecting'; S.connError = null; render();
    try {
      const res = await mcp.callTool(SERVER, TOOL, INPUT, { cache: CACHE });
      if (accept(res)) startWatch();
    } catch (e) {
      if (e && e.retryable && e.code === 'upstream_error') {
        await new Promise(r => setTimeout(r, Math.min(e.retryAfterMs || 1500, 8000) + Math.random() * 400));
        try { const res = await mcp.callTool(SERVER, TOOL, INPUT, { cache: CACHE }); if (accept(res)) startWatch(); return; } catch (e2) { e = e2; }
      }
      S.conn = 'connect'; S.connError = errMsg(e); render();
    }
  }
  async function refresh() {
    if (!mcp) return;
    const b = $('#refresh-btn'); if (b) { b.disabled = true; b.lastChild.textContent = 'Refreshing…'; }
    try { const res = await mcp.callTool(SERVER, TOOL, INPUT, { cache: { ...CACHE, refresh: true } }); accept(res); toast('Results refreshed from Function'); }
    catch (e) { S.refreshNote = errMsg(e); render(); }
  }

  // ── Expert review via Claude ─────────────────────────────────────────
  function dataDigest() {
    const d = S.data;
    const lines = d.markers.map(m => {
      const hist = m.pts.map(p => `${p.date}: ${p.raw}`).join('; ');
      const st = m.state === 'high' ? 'ABOVE RANGE' : m.state === 'low' ? 'BELOW RANGE' : m.state === 'ok' ? 'in range' : 'informational';
      return `- ${m.name} [${m.cat}] unit=${m.unit || 'n/a'} | Function range: ${m.rangeStr || 'n/a'} | latest ${st} | history: ${hist}`;
    });
    return lines.join('\n');
  }
  const FOCUS_TEXT = { whole: 'the whole picture', heart: 'heart and metabolic health', brain: 'brain health and cognition', longevity: 'longevity and the pace of aging' };

  async function runReview() {
    if (!S.data || !S.experts.length) return;
    const chosen = EXPERTS.filter(e => S.experts.includes(e.id));
    if (DEMO) {
      S.review = { status: 'thinking', progress: 'Your experts are reading the sample results…', expertIds: chosen.map(e => e.id) }; render();
      await new Promise(r => setTimeout(r, 1400));
      const all = window.HW_DEMO.reviews;
      S.review = { status: 'done', result: { consensus: all.consensus, experts: chosen.map(e => all.experts.find(x => x.id === e.id)).filter(Boolean) }, expertIds: chosen.map(e => e.id) };
      if (S.view === 'advisor') render();
      return;
    }
    if (!sampleFn) { S.review = { status: 'error', error: 'Expert reviews need Claude, which isn\'t available in this view. Open the page in Claude while signed in.' }; return render(); }
    if (chosen.length > 5) { S.review = { status: 'error', error: 'Choose up to five experts per review so each one gets a full read. Run a second review for the rest.' }; return render(); }
    const prompt = [
      'You are the analysis engine inside Healthwise, a health-data app. The user has chosen health experts whose PUBLISHED frameworks they want applied to their own lab results from Function Health.',
      '',
      'Rules:',
      '- Write about each framework in the third person ("Attia\'s framework puts ApoB first..."). Never write in the expert\'s voice, never invent quotes, and never imply the expert has seen this data.',
      '- Use only values present in the data below. Cite real numbers with units and dates when they matter. Note direction over time.',
      '- Educational, not medical advice. Do not give drug doses or tell the user to start or stop a medication. Frame next steps as questions for their clinician.',
      `- Emphasis requested by the user: ${FOCUS_TEXT[S.focus] || FOCUS_TEXT.whole}.`,
      '- Each expert should lead with what THEIR framework would notice first, so the experts differ where their frameworks differ.',
      '- Plain, direct language. No em dashes.',
      '',
      'Experts:',
      ...chosen.map(e => `[${e.id}] ${e.name}: ${e.frame}`),
      '',
      `Lab results (latest draw ${fmtDate(S.data.latestTs)}; each line lists every draw, oldest first):`,
      dataDigest(),
      '',
      'Reply with only JSON in exactly this shape:',
      '{"consensus": "one or two sentences on what these experts would agree on", "experts": [{"id": "<expert id from the list>", "headline": "the single most important read, under 160 characters", "focus": [{"marker": "<exact marker name from the data>", "value": "<latest value>", "unit": "<unit>", "note": "one sentence on why this framework cares"}], "takeaway": "two sentences at most", "ask_your_doctor": "one question to bring to a clinician", "confidence": "high|medium|low"}]}',
      'Give 2 to 4 focus markers per expert, in the same order as the expert list.'
    ].join('\n');

    reviewCtl = new AbortController();
    S.review = { status: 'thinking', progress: 'Your experts are reading your results…', expertIds: chosen.map(e => e.id) };
    render();
    try {
      const out = await sampleFn.json(prompt, {
        signal: reviewCtl.signal, modelTier: 'default', cache: { gcTime: 6 * 3600e3 },
        onText: ({ text }) => { const p = $('#review-progress'); if (p) p.textContent = `Writing the review… ${Math.min(99, Math.round(text.length / 40))}%`; }
      });
      S.review = { status: 'done', result: out, expertIds: chosen.map(e => e.id) };
    } catch (e) {
      const code = e && e.code;
      const msg = {
        cancelled: 'Review stopped.',
        not_granted: 'Claude wasn\'t allowed to run for this page. Allow it when asked to get expert reviews.',
        sampling_disabled: 'Claude isn\'t available for this account.',
        rate_limited: 'You\'ve reached a Claude usage limit. Try again a little later.',
        session_expired: 'Your Claude session expired. Sign in again and retry.',
        invalid_json: 'The review came back in an unexpected format. Press Review again.',
        prompt_too_large: 'Too much data for one review. Choose fewer experts or a narrower focus.',
        refused: 'Claude declined this review. Try a different focus.',
        upstream_error: 'Claude didn\'t respond. Press Review again.'
      }[code] || `The review didn't finish (${code || 'unknown'}). Press Review again.`;
      S.review = code === 'cancelled' ? null : { status: 'error', error: msg };
    }
    reviewCtl = null;
    if (S.view === 'advisor') render();
  }

  // ── Boot ─────────────────────────────────────────────────────────────
  const initial = (location.hash || '').replace('#', '');
  if (['home', 'labs', 'advisor', 'research'].includes(initial)) S.view = initial;
  render();

  (async () => {
    const c = window.claude;
    if (DEMO) {
      RS.model = 'default'; RS.local = 'off';
      S.data = normalize(window.HW_DEMO.payload); S.conn = 'ready'; S.refreshNote = 'Sample data';
      const ui = $('#unlock-intro'); if (ui) ui.textContent = 'This demo shows the free edition on sample results. The free edition reads your own Function results and keeps nothing. Full Healthwise runs on your own computer and adds:';
      return render();
    }
    if (!c || typeof c.use !== 'function') { S.conn = 'needs-claude'; return render(); }
    const [m, p, s] = await Promise.all([c.use('mcp').catch(() => null), c.use('permissions').catch(() => null), c.use('sample').catch(() => null)]);
    mcp = m; perms = p; sampleFn = s;
    if (!mcp) { S.conn = 'needs-claude'; return render(); }
    let st = 'prompt';
    if (perms) st = await perms.state('mcp:' + SERVER).catch(() => 'prompt');
    if (st === 'granted') { S.conn = 'connecting'; render(); startWatch(); }
    else { S.conn = 'connect'; render(); }
  })();
})();
</script>
</body></html>
